name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: E2E Test Suite (Ubuntu, py${{ matrix.python }}, node${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
        node: ['20', '22']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd sqlite3

      - name: Install Python & Node Dependencies
        run: |
          pip install jieba
          npm install

      - name: Run E2E Test Suite
        run: |
          python3 -V
          node -v
          bash scripts/run-e2e-test.sh /tmp/gts-ci-testbed
