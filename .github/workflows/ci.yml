name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: E2E Test Suite (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd sqlite3

      - name: Install Python & Node Dependencies
        run: |
          pip install jieba
          npm install

      - name: Run E2E Test Suite
        run: |
          bash scripts/run-e2e-test.sh /tmp/gts-ci-testbed
