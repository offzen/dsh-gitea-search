name: CI

on:
  push:
    branches: [ main, 'v*', 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]
  workflow_dispatch:
    inputs:
      exact_sha:
        description: Full 40-hex candidate SHA; must equal the dispatched ref SHA
        required: true
        type: string

jobs:
  # Ubuntu 与 macOS 共用同一套验证（单元测试 + e2e）。
  # 此前 Linux 只跑 e2e、Windows 只跑单元用例，两个平台各自看不到对方的失败，
  # v1.2.2-rc 的 POSIX 回归正是从这道缝里漏过去的。现在两个 job 都跑完整组合，
  # 且单元测试中的 POSIX 语义用例会在 Windows 上自动 skip、在 POSIX 上生效。
  test:
    name: Unit + E2E (Ubuntu, py${{ matrix.python }}, node${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
        node: ['20', '22']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd sqlite3

      - name: Install Python & Node Dependencies
        run: |
          pip install jieba PyYAML
          npm install

      - name: Run Unit + E2E Test Suite
        run: |
          python3 -V
          node -v
          npm run test:all

  package:
    name: Python wheel + sdist (Ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Install artifacts away from the checkout
        run: python scripts/test-python-package.py dist

      - name: Check frozen provenance manifest
        run: python scripts/check-provenance.py

  test-macos:
    name: Unit + E2E (macOS, py3.12, node22)
    # 本项目 v1.2.0 起就带 BSD 兼容代码（macOS 与 Linux 共用这批共享文件），
    # 但直到 v1.2.2-rc 仍没有 macOS runner，Apple Silicon/APFS 侧的路径语义
    # 完全没有被验证过。补上，确保 Windows 适配不会再悄悄改坏 POSIX 行为。
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System Dependencies
        run: |
          # macOS 自带 sqlite3；zstd 视镜像而定，缺了才装
          command -v sqlite3 || brew install sqlite
          command -v zstd || brew install zstd

      - name: Install Python & Node Dependencies
        run: |
          pip install jieba PyYAML
          npm install

      - name: Run Unit + E2E Test Suite
        run: |
          python3 -V
          node -v
          npm run test:all

  hosted-linux-receipt:
    name: Hosted Linux exact-SHA receipt
    if: github.server_url == 'https://github.com' && github.event_name != 'pull_request'
    needs: [test, package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Write exact-SHA hosted receipt
        env:
          GTS_DISPATCH_EXACT_SHA: ${{ github.event.inputs.exact_sha || github.sha }}
        run: >-
          python .github/scripts/write-gate-receipt.py
          --gate github-linux
          --commit "${{ github.sha }}"
          --runner-label ubuntu-latest
          --output "${{ runner.temp }}/github-linux.json"
      - name: Upload hosted receipt
        uses: actions/upload-artifact@v4
        with:
          name: github-linux-${{ github.sha }}
          path: ${{ runner.temp }}/github-linux.json
          if-no-files-found: error
          retention-days: 30

  hosted-macos-receipt:
    name: Hosted macOS exact-SHA receipt
    if: github.server_url == 'https://github.com' && github.event_name != 'pull_request'
    needs: [test-macos]
    runs-on: macos-latest
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Write exact-SHA hosted receipt
        env:
          GTS_DISPATCH_EXACT_SHA: ${{ github.event.inputs.exact_sha || github.sha }}
        run: >-
          python .github/scripts/write-gate-receipt.py
          --gate github-macos
          --commit "${{ github.sha }}"
          --runner-label macos-latest
          --output "${{ runner.temp }}/github-macos.json"
      - name: Upload hosted receipt
        uses: actions/upload-artifact@v4
        with:
          name: github-macos-${{ github.sha }}
          path: ${{ runner.temp }}/github-macos.json
          if-no-files-found: error
          retention-days: 30
